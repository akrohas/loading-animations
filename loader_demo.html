<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо: анимация загрузки с шарами</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #f7f5fb 0%, #e8f0fe 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .demo-content {
        text-align: center;
        padding: 20px;
    }

    .demo-content h1 {
        color: #7c739d;
        font-size: 32px;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    .demo-content p {
        color: #9a8fb8;
        font-size: 17px;
        margin-bottom: 30px;
    }

    #replay-btn {
        background-color: #a38fcc;
        color: #ffffff;
        font-family: inherit;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 1px;
        padding: 14px 32px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #replay-btn:hover {
        background-color: #8f77c2;
        transform: translateY(-2px);
    }

    #replay-btn:active {
        transform: translateY(0);
    }

    /* ===== АНИМАЦИЯ ЗАГРУЗКИ САЙТА С ШАРАМИ ===== */
    #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f7f5fb;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.5s ease;
    }

    .balloon {
        position: absolute;
        bottom: -150px;
        border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        animation: flyUp 3s ease-in forwards;
    }

    .balloon::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-bottom: 8px solid currentColor;
    }

    .balloon::before {
        content: "";
        position: absolute;
        bottom: -38px;
        left: 50%;
        width: 2px;
        height: 30px;
        background-color: rgba(0, 0, 0, 0.15);
    }

    .loading-text-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10000;
        pointer-events: none;
    }

    .loading-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #7c739d;
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 2px;
        animation: fadeInOut 1.5s infinite;
    }

    @keyframes flyUp {
        0% {
            transform: translateY(0) translateX(0) scale(1);
            opacity: 1;
        }

        80% {
            opacity: 1;
        }

        100% {
            transform: translateY(-120vh) translateX(var(--wobble)) scale(1.1);
            opacity: 0;
        }
    }

    @keyframes fadeInOut {
        0%, 100% {
            opacity: 0.4;
        }

        50% {
            opacity: 1;
        }
    }
</style>
</head>
<body>

<!-- АНИМАЦИЯ ЗАГРУЗКИ САЙТА С ШАРАМИ -->
<div id="loader-wrapper">
    <div class="loading-text-wrapper">
        <div class="loading-text">Надуваем шары...</div>
    </div>
</div>

<!-- ДЕМО-КОНТЕНТ (виден после загрузки) -->
<div class="demo-content">
    <h1>Кворк готов!</h1>
    <p>Так выглядит страница после проигрывания анимации загрузки.</p>
    <button id="replay-btn">Проиграть заново</button>
</div>

<!-- JavaScript-код -->
<script>
    (function () {
        const isVisited = sessionStorage.getItem('animationPlayed');
        const html = document.documentElement;

        if (isVisited) {
            html.insertAdjacentHTML('beforeend', '<style id="temp-loader-css">#loader-wrapper { display: none !important; }</style>');
        } else {
            html.style.overflow = 'hidden';
            if (document.body) document.body.style.overflow = 'hidden';
        }

        document.addEventListener('DOMContentLoaded', function () {
            const body = document.body;
            const loader = document.getElementById('loader-wrapper');
            const tempStyle = document.getElementById('temp-loader-css');

            if (isVisited) {
                if (loader) loader.remove();
                if (tempStyle) tempStyle.remove();
                html.style.overflow = '';
                body.style.overflow = '';
                return;
            }

            body.style.overflow = 'hidden';

            const colors = ['#a38fcc', '#c3b1e1', '#b2cefe', '#fbcce7', '#ffdfba', '#e8f0fe'];

            function createBalloon() {
                if (!loader) return;
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');

                const size = Math.floor(Math.random() * 50) + 70;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const leftPos = Math.floor(Math.random() * 90);
                const delay = Math.random() * 1.5;
                const wobble = (Math.random() * 100 - 50) + 'px';

                balloon.style.width = size + 'px';
                balloon.style.height = (size * 1.2) + 'px';
                balloon.style.backgroundColor = color;
                balloon.style.color = color;
                balloon.style.left = leftPos + '%';
                balloon.style.animationDelay = delay + 's';
                balloon.style.setProperty('--wobble', wobble);

                loader.appendChild(balloon);
            }

            for (let i = 0; i < 25; i++) {
                createBalloon();
            }

            setTimeout(function () {
                if (loader) {
                    loader.style.opacity = '0';

                    setTimeout(function () {
                        loader.remove();
                        html.style.overflow = '';
                        body.style.overflow = '';

                        sessionStorage.setItem('animationPlayed', 'true');
                    }, 500);
                }
            }, 3000);
        });
    })();

    // Кнопка «Проиграть заново»: сбрасывает флаг и перезагружает страницу
    document.getElementById('replay-btn').addEventListener('click', function () {
        sessionStorage.removeItem('animationPlayed');
        location.reload();
    });
</script>
</body>
</html>
